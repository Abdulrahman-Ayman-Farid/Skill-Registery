apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skill-registry-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdulrahman-Ayman-Farid/Skill-Registery.git
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: skill-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
