apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skill-registry-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdulrahman-Ayman-Farid/Skill-Registery.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: skill-registry-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
