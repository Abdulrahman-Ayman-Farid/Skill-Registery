apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-registry
  labels:
    app: skill-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-registry
  template:
    metadata:
      labels:
        app: skill-registry
    spec:
      containers:
        - name: app
          image: skill-registry:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
