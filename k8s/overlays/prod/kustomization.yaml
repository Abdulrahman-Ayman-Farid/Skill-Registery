apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skill-registry-prod
resources:
  - ../../base
  - hpa.yaml
images:
  - name: skill-registry
    newTag: prod
patches:
  - target:
      kind: Deployment
      name: skill-registry
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
